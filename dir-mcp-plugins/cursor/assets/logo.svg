<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2fff"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#00d4ff" stroke-width="0.5" opacity="0.9"/>

  <!-- Central hub node -->
  <circle cx="32" cy="32" r="6" fill="url(#accent)" opacity="0.95"/>

  <!-- Outer nodes -->
  <circle cx="32" cy="10" r="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="52" cy="21" r="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="52" cy="43" r="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="32" cy="54" r="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="12" cy="43" r="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="12" cy="21" r="4" fill="url(#accent)" opacity="0.85"/>

  <!-- Edges: center to outer -->
  <line x1="32" y1="32" x2="32" y2="14" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="32" x2="49" y2="23" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="32" x2="49" y2="41" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="32" x2="32" y2="50" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="32" x2="15" y2="41" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="32" y1="32" x2="15" y2="23" stroke="#00d4ff" stroke-width="1.2" opacity="0.6"/>

  <!-- Outer ring edges (hexagon outline) -->
  <polygon points="32,10 52,21 52,43 32,54 12,43 12,21"
           fill="none" stroke="#7b2fff" stroke-width="0.8" opacity="0.4"/>
</svg>
