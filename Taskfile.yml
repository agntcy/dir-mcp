version: "3"

vars:
  BIN_DIR: ./.bin
  GOLANGCI_LINT_VERSION: "2.11.3"
  GOLANGCI_LINT_BIN: "{{ .BIN_DIR }}/golangci-lint-{{ .GOLANGCI_LINT_VERSION }}"
  IMAGE_REPO: '{{ .IMAGE_REPO | default "ghcr.io/agntcy/dir-mcp" }}'
  IMAGE_TAG: '{{ .IMAGE_TAG | default "latest" }}'

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  build:
    desc: Build the MCP server binary
    vars:
      GOOS: "{{ .GOOS | default OS }}"
      GOARCH: "{{ .GOARCH | default ARCH }}"
      OUT_BINARY: "{{ .BIN_DIR }}/mcp-server"
    cmds:
      - mkdir -p {{ .BIN_DIR }}
      - CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -o "{{.OUT_BINARY}}" main.go

  docker:build:
    desc: Build the Docker image
    cmds:
      - docker build -t {{ .IMAGE_REPO }}:{{ .IMAGE_TAG }} .

  test:
    desc: Run all tests (unit + e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run unit tests
    cmds:
      - go test -count=1 ./...

  test:e2e:
    desc: Run e2e tests
    dir: tests/e2e
    cmds:
      - go test -v -timeout 5m ./...

  lint:
    desc: Run linters
    deps:
      - deps:golangci-lint
    vars:
      LINT_BIN: "{{ .ROOT_DIR }}/{{ .GOLANGCI_LINT_BIN }}"
    cmds:
      - "{{ .LINT_BIN }} run ./..."
      - cd tests/e2e && "{{ .LINT_BIN }}" run ./...

  license:
    desc: Run license check
    cmds:
      - licensei cache
      - licensei check

  deps:
    desc: Install development dependencies and git hooks
    cmds:
      - pre-commit install
    status:
      - test -f .git/hooks/pre-commit

  deps:bin-dir:
    internal: true
    cmds:
      - mkdir -p {{ .BIN_DIR }}
    status:
      - test -d {{ .BIN_DIR }}

  deps:golangci-lint:
    desc: Install golangci-lint
    internal: true
    deps:
      - deps:bin-dir
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b {{ .BIN_DIR }} v{{ .GOLANGCI_LINT_VERSION }}
      - mv {{ .BIN_DIR }}/golangci-lint {{ .GOLANGCI_LINT_BIN }}
      - chmod +x {{ .GOLANGCI_LINT_BIN }}
    status:
      - test -x {{ .GOLANGCI_LINT_BIN }}

  mcpb:pack:
    desc: "Update version refs in server.json and manifest.json, build mcpb bundle locally, and inject fileSha256 (usage: task mcpb:pack VERSION=1.3.4)"
    vars:
      VERSION: '{{ .VERSION | default "" }}'
      MCPB_URL: "https://github.com/agntcy/dir-mcp/releases/download/v{{.VERSION}}/dir-mcp.mcpb"
    preconditions:
      - sh: '[ -n "{{.VERSION}}" ]'
        msg: "VERSION is required, e.g.: task mcpb:pack VERSION=1.3.4"
      - sh: "command -v mcpb"
        msg: "mcpb CLI not found — install with: npm install -g @anthropic-ai/mcpb"
    cmds:
      # Update manifest.json version
      - jq --arg v "{{.VERSION}}" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
      # Update server.json: top-level version, OCI identifier tag, mcpb identifier URL, mcpb version
      - |
        jq \
          --arg v "{{.VERSION}}" \
          --arg mcpb_url "{{.MCPB_URL}}" \
          '
            .version = $v |
            (.packages[] | select(.registryType == "oci")).identifier = "ghcr.io/agntcy/dir-mcp:\($v)" |
            (.packages[] | select(.registryType == "mcpb")).identifier = $mcpb_url |
            (.packages[] | select(.registryType == "mcpb")).version = $v
          ' server.json > server.json.tmp && mv server.json.tmp server.json
      # Build cross-platform binaries
      - mkdir -p bundle/server
      - CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o bundle/server/mcp-server              main.go
      - CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o bundle/server/mcp-server-darwin       main.go
      - CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o bundle/server/mcp-server-darwin-amd64 main.go
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o bundle/server/mcp-server.exe          main.go
      - cp manifest.json bundle/manifest.json
      # Pack the mcpb bundle
      - mcpb pack bundle dir-mcp.mcpb
      # Compute SHA256 and inject into server.json
      - |
        SHA256=$(sha256sum dir-mcp.mcpb 2>/dev/null | awk '{print $1}' || shasum -a 256 dir-mcp.mcpb | awk '{print $1}')
        jq --arg sha "$SHA256" '(.packages[] | select(.registryType == "mcpb")).fileSha256 = $sha' server.json > server.json.tmp
        mv server.json.tmp server.json
      # Clean up build directory
      - rm -rf bundle dir-mcp.mcpb

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{ .BIN_DIR }}
      - rm -f dir-mcp.mcpb
