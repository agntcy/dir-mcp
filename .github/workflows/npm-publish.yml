---
name: npm Publish

# Publishes @agntcy/dir-mcp to npm. Runs once the version-bump PR opened by
# npm-release.yml (branch prefix npm-release/vX.Y.Z) is merged into main —
# at that point package.json already carries the version to publish, so
# there's no need to resolve a tag from a commit SHA here.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag; defaults to 'latest' for releases and 'next' for prereleases"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'npm-release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Resolve version to publish
        id: ctx
        env:
          INPUT_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          VERSION=$(node -p "require('./dir-mcp-plugins/npm/package.json').version")
          TAG="v${VERSION}"

          # A version with a prerelease component (1.3.4-mcp.1) cannot be
          # published without an explicit dist-tag — npm rejects it — and must
          # never take over `latest`.
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="${INPUT_NPM_TAG:-next}"
            if [[ "$NPM_TAG" == "latest" ]]; then
              echo "Error: refusing to publish prerelease $VERSION under the 'latest' dist-tag"
              exit 1
            fi
          else
            NPM_TAG="${INPUT_NPM_TAG:-latest}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under npm dist-tag '$NPM_TAG'"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@agntcy"

      - name: Run tests
        run: npm test
        working-directory: dir-mcp-plugins/npm

      - name: Verify mcp-server binaries exist on this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          echo "Checking release $TAG has mcp-server-* assets (the npm package's postinstall downloads these at install time)"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^mcp-server-' \
            || { echo "Error: release $TAG has no mcp-server-* assets"; exit 1; }

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.ctx.outputs.npm_tag }}"
        working-directory: dir-mcp-plugins/npm
