---
name: npm Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish (e.g. 1.3.5)"
        required: true
      npm_tag:
        description: "npm dist-tag (e.g. latest, next, beta)"
        default: "latest"

env:
  DIRCTL_REPO: agntcy/dir

permissions:
  contents: read
  id-token: write

jobs:
  build-mcp-server:
    name: Build MCP Server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: mcp-server-linux-amd64
          - goos: linux
            goarch: arm64
            binary: mcp-server-linux-arm64
          - goos: darwin
            goarch: arm64
            binary: mcp-server-darwin-arm64
          - goos: darwin
            goarch: amd64
            binary: mcp-server-darwin-amd64
          - goos: windows
            goarch: amd64
            binary: mcp-server-windows-amd64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o ${{ matrix.binary }} main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

  publish-npm:
    name: Publish to npm
    needs: build-mcp-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download mcp-server binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcp-server-*
          path: dir-mcp-plugins/npm/bin/
          merge-multiple: true

      - name: Download dirctl binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIRCTL_TAG=$(gh release list -R "$DIRCTL_REPO" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Downloading dirctl $DIRCTL_TAG from $DIRCTL_REPO"
          for PLATFORM in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            gh release download "$DIRCTL_TAG" \
              -R "$DIRCTL_REPO" \
              -p "dirctl-${PLATFORM}" \
              -D dir-mcp-plugins/npm/bin/ \
            && echo "Downloaded dirctl-${PLATFORM}" \
            || echo "Warning: dirctl-${PLATFORM} not found in release $DIRCTL_TAG, skipping"
          done

      - name: Make binaries executable
        run: chmod +x dir-mcp-plugins/npm/bin/mcp-server-* dir-mcp-plugins/npm/bin/dirctl-* 2>/dev/null || true

      - name: Set npm version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version
        working-directory: dir-mcp-plugins/npm

      - name: Run tests
        run: npm test
        working-directory: dir-mcp-plugins/npm

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            NPM_TAG="${{ inputs.npm_tag }}"
          else
            NPM_TAG="latest"
          fi
          npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: dir-mcp-plugins/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
