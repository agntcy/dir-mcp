---
name: npm Release

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v1.3.5)"
        required: true
      npm_tag:
        description: "npm dist-tag; defaults to 'latest' for releases and 'next' for prereleases"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    # For workflow_run: only run when the Release workflow succeeded on a version tag.
    # For workflow_dispatch: always run.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            # Use the /tags endpoint (not /git/refs/tags): it reports the
            # peeled commit SHA for both lightweight and annotated tags,
            # whereas /git/refs/tags reports the tag object's own SHA for
            # annotated tags, which never matches a workflow_run head_sha.
            TAG=$(gh api "repos/${{ github.repository }}/tags" \
              --jq '.[] | select(.commit.sha == "${{ github.event.workflow_run.head_sha }}") | .name' \
              | head -1)
            if [[ -z "$TAG" ]]; then
              echo "Error: could not resolve a tag for commit ${{ github.event.workflow_run.head_sha }}"
              exit 1
            fi
          fi
          VERSION="${TAG#v}"

          # A version with a prerelease component (1.3.4-mcp.1) cannot be
          # published without an explicit dist-tag — npm rejects it — and must
          # never take over `latest`.
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="${INPUT_NPM_TAG:-next}"
            if [[ "$NPM_TAG" == "latest" ]]; then
              echo "Error: refusing to publish prerelease $VERSION under the 'latest' dist-tag"
              exit 1
            fi
          else
            NPM_TAG="${INPUT_NPM_TAG:-latest}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under npm dist-tag '$NPM_TAG'"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ctx.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@agntcy"

      - name: Run tests
        run: npm test
        working-directory: dir-mcp-plugins/npm

      - name: Verify mcp-server binaries exist on this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ctx.outputs.tag }}"
          echo "Checking release $TAG has mcp-server-* assets (the npm package's postinstall downloads these at install time)"
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^mcp-server-' \
            || { echo "Error: release $TAG has no mcp-server-* assets"; exit 1; }

      - name: Set npm version
        run: npm version "${{ steps.ctx.outputs.version }}" --no-git-tag-version
        working-directory: dir-mcp-plugins/npm

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.ctx.outputs.npm_tag }}"
        working-directory: dir-mcp-plugins/npm
