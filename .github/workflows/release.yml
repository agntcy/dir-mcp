---
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test -race ./...

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Run e2e tests
        run: task test:e2e

  docker:
    name: Docker Image
    needs:
      - test
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcpb:
    name: MCPB Bundle
    needs:
      - test
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Build cross-platform binaries
        run: |
          mkdir -p bundle/server
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o bundle/server/mcp-server             main.go
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o bundle/server/mcp-server-darwin      main.go
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o bundle/server/mcp-server-darwin-amd64 main.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o bundle/server/mcp-server.exe         main.go

      - name: Set version in manifest.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' manifest.json > bundle/manifest.json

      - name: Pack MCPB bundle
        run: mcpb pack bundle dir-mcp.mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-bundle
          path: dir-mcp.mcpb
          retention-days: 1

  release:
    name: GitHub Release
    needs:
      - docker
      - mcpb
    runs-on: ubuntu-latest
    steps:
      - name: Download MCPB artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb-bundle

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          generate_release_notes: true
          files: dir-mcp.mcpb

  update-server-json:
    name: Update server.json
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Update server.json and manifest.json versions
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].version = $v | .packages[1].version = $v | .packages[1].identifier = "https://github.com/agntcy/dir-mcp/releases/download/v\($v)/dir-mcp.mcpb"' \
            server.json > server.tmp && mv server.tmp server.json
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: update server.json and manifest.json version to ${{ github.ref_name }}"
          branch: chore/server-json-${{ github.ref_name }}
          title: "chore: update server.json and manifest.json version to ${{ github.ref_name }}"
          body: |
            Automated version bump following release ${{ github.ref_name }}.

            - `server.json`: top-level version, docker package version, mcpb package version and identifier URL
            - `manifest.json`: bundle version

            Required before publishing to the MCP Registry.
          labels: chore
          signoff: true
